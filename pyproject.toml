[project]
name = "data-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "hamza", email = "hamza.elmalki1234@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ipython>=9.18.1",
    "langchain>=1.4.9",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.2",
    "langchain-groq>=1.1.3",
    "langchian>=0.2.5",
    "langgraph>=1.2.19",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
]

[project.scripts]
data-agent = "data_agent:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
