version: '3'

services:

  db:
    container_name: db
    image: postgres:16
    restart: unless-stopped
    ports:
      - ${port}:${port}

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - pgdata:/var/lib/postgresql/data
      

volumes:
  pgdata:
    driver : local 